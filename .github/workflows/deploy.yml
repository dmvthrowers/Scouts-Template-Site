name: Build and deploy

# Builds the site from site.jsonc and publishes it to GitHub Pages.
# One-time setup: Settings > Pages > Build and deployment > Source: "GitHub Actions".
on:
  push:
    branches: [main]
  pull_request:          # build + check only, never deploys
  schedule:
    - cron: "23 6 * * *" # every morning: pulls new calendar events and drops past ones
  workflow_dispatch:     # "Run workflow" button on the Actions tab

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Actions are pinned to exact versions for safety; Dependabot keeps them up to date.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # Optional. With a repository secret named CALENDAR_ICS_URL (the calendar's "Secret address in iCal format"),
      # upcoming events are pulled from Google Calendar into the site. Without it this step does nothing.
      # See "Events from Google Calendar" in the README.
      - name: Pull events from the calendar
        if: github.repository != 'dmvthrowers/scouts-template-site'
        env:
          CALENDAR_ICS_URL: ${{ secrets.CALENDAR_ICS_URL }}
          CALENDAR_TZ: ${{ vars.CALENDAR_TZ }}
        run: |
          python3 -m unittest discover -s scripts -p "test_*.py"
          python3 scripts/sync_calendar.py
      - name: Find the site address
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Build and check
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        # The original template repo publishes a showcase page with example sites instead.
        # Your copy builds your own site.
        run: |
          if [ "${GITHUB_REPOSITORY,,}" = "dmvthrowers/scouts-template-site" ]; then
            python3 scripts/build_showcase.py
          else
            python3 build.py
            python3 scripts/check_site.py --real
          fi
      # The W3C Nu HTML Checker (the validator behind validator.w3.org), errors only: a green run means no invalid
      # markup, such as an element in the wrong place or a skipped heading level. Uses the Java on ubuntu-latest.
      - name: Validate the HTML
        run: |
          npm install --prefix "$RUNNER_TEMP/vnu" --no-audit --no-fund vnu-jar@26.10.7
          java -jar "$RUNNER_TEMP/vnu/node_modules/vnu-jar/build/dist/vnu.jar" --errors-only --skip-non-html $(find _site -name '*.html')
      - name: Package the site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
